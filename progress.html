        function generateNicknames(style) {
            const nicknames = nicknameDatabase[style] || nicknameDatabase.emotional;
            
            // 랜덤하게 3개 선택
            const shuffled = [...nicknames].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert(`"${text}"가 클립보드에 복사되었습니다!`);
            }).catch(() => {
                // 클립보드 API가 지원되지 않는 경우 대체 방법
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert(`"${text}"가 클립보드에 복사되었습니다!`);
            });
        }

                    <span class="nickname-text">${nickname}</span>
                    <button class="copy-btn" data-nickname="${nickname}">복사</button>

                nicknameList.appendChild(nicknameEl);

    // 기대사항 & 문의 기능
    window.addEventListener('DOMContentLoaded', () => {
        const submitBtn = document.getElementById('submitInquiry');
        const inquiryMessages = document.getElementById('inquiryMessages');
        const adminToggle = document.getElementById('adminToggle');
        
        // 관리자 모드 상태 (기본값: false)
        let isAdminMode = false;
        
        // 관리자 모드 토글
        adminToggle.addEventListener('click', () => {
            const password = prompt('관리자 비밀번호를 입력하세요:');
            if (password === 'admin123') { // 간단한 비밀번호
                isAdminMode = !isAdminMode;
                adminToggle.textContent = isAdminMode ? '일반 모드' : '관리자 모드';
                adminToggle.style.background = isAdminMode ? 'var(--primary)' : 'transparent';
                adminToggle.style.color = isAdminMode ? 'var(--bg)' : 'var(--primary)';
                displayInquiries(); // 화면 다시 그리기
            } else if (password !== null) {
                alert('비밀번호가 올바르지 않습니다.');
            }
        });
        
        // 로컬 스토리지에서 메시지 불러오기
        loadInquiries();
        
        submitBtn.addEventListener('click', () => {
            const name = document.getElementById('inquiryName').value.trim();
            const type = document.getElementById('inquiryType').value;
            const message = document.getElementById('inquiryMessage').value.trim();
            
            if (!name || !type || !message) {
                alert('모든 항목을 입력해주세요!');
                return;
            }
            
            const inquiry = {
                id: Date.now(),
                name: name,
                type: type,
                message: message,
                date: new Date().toLocaleDateString('ko-KR')
            };
            
            // 로컬 스토리지에 저장
            const inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            inquiries.unshift(inquiry); // 최신 메시지가 위에 오도록
            localStorage.setItem('inquiries', JSON.stringify(inquiries));
            
            // 화면에 표시
            displayInquiries();
            
            // 폼 초기화
            document.getElementById('inquiryName').value = '';
            document.getElementById('inquiryType').value = '';
            document.getElementById('inquiryMessage').value = '';
            
            alert('메시지가 등록되었습니다!');
        });
        
        function loadInquiries() {
            displayInquiries();
        }
        
        function displayInquiries() {
            const inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            inquiryMessages.innerHTML = '';
            
            if (inquiries.length === 0) {
                inquiryMessages.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 20px;">아직 등록된 메시지가 없습니다.</p>';
                return;
            }
            
            inquiries.forEach(inquiry => {
                const inquiryEl = document.createElement('div');
                inquiryEl.className = 'inquiry-item';
                
                // 관리자 모드일 때만 삭제 버튼 표시
                const deleteButton = isAdminMode ? 
                    `<button class="delete-btn" onclick="deleteInquiry(${inquiry.id})">삭제</button>` : '';
                
                inquiryEl.innerHTML = `
                    <div class="inquiry-header">
                        <span class="inquiry-name">${inquiry.name}</span>
                        <span class="inquiry-type">${getTypeLabel(inquiry.type)}</span>
                        <span class="inquiry-date">${inquiry.date}</span>
                        ${deleteButton}
                    </div>
                    <div class="inquiry-content">${inquiry.message}</div>
                `;
                inquiryMessages.appendChild(inquiryEl);
            });
        }
        
        // 전역 함수로 삭제 기능 추가
        window.deleteInquiry = function(id) {
            if (confirm('정말로 이 메시지를 삭제하시겠습니까?')) {
                const inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
                const filteredInquiries = inquiries.filter(inquiry => inquiry.id !== id);
                localStorage.setItem('inquiries', JSON.stringify(filteredInquiries));
                displayInquiries();
            }
        };
        
        function getTypeLabel(type) {
            const labels = {
                'expectation': '기대사항',
                'question': '궁금한 점',
                'cheer': '응원 메시지',
                'other': '기타'
            };
            return labels[type] || type;
        }
    });

    // 기존 진행상황 기능
    window.addEventListener('DOMContentLoaded', async () => {
        const listEl = document.getElementById('progressList');
        const summaryEl = document.getElementById('summary');
        const filterEl = document.getElementById('filterText');

        const res = await fetch('data/progress.json', { cache: 'no-store' });
        const data = await res.json();

        const render = (items) => {
            listEl.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card progress-card';
                card.innerHTML = `
                    <header class="card-header">
                        <span class="badge">${item.week ? 'W' + item.week : item.milestone || ''}</span>
                        <h3>${item.title}</h3>
                    </header>
                    <div class="card-body">
                        <p>${item.summary}</p>
                        ${item.links && item.links.length ? `<ul class="links">${item.links.map(l => `<li><a target="_blank" rel="noopener" href="${l.url}">${l.label || '링크'}</a></li>`).join('')}</ul>` : ''}
                        ${item.media ? `<div class="media">${item.media.type === 'youtube' ? `<iframe src="https://www.youtube.com/embed/${item.media.id}" title="YouTube video" allowfullscreen></iframe>` : ''}</div>` : ''}
                    </div>
                    <footer class="card-footer">
                        <time datetime="${item.date}">${item.date}</time>
                        ${item.tags && item.tags.length ? `<div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
                    </footer>
                `;
                listEl.appendChild(card);
            });
        };

        const computeSummary = (items) => {
            const total = items.length;
            const milestones = items.filter(i => !!i.milestone).length;
            const weeks = items.filter(i => !!i.week).length;
            summaryEl.innerHTML = `<div class="stats">
                <div class="stat"><span class="num">${weeks}</span><span class="label">주간 업데이트</span></div>
                <div class="stat"><span class="num">${milestones}</span><span class="label">마일스톤</span></div>
                <div class="stat"><span class="num">${total}</span><span class="label">총 업데이트</span></div>
            </div>`;
        };

        computeSummary(data.items);
        render(data.items);

        const filter = () => {
            const q = (filterEl.value || '').toLowerCase();
            const filtered = data.items.filter(i =>
                (i.title && i.title.toLowerCase().includes(q)) ||
                (i.summary && i.summary.toLowerCase().includes(q)) ||
                (i.milestone && i.milestone.toLowerCase().includes(q)) ||
                (String(i.week || '').includes(q)) ||
                (Array.isArray(i.tags) && i.tags.some(t => t.toLowerCase().includes(q)))
            );
            render(filtered);
        };

        filterEl.addEventListener('input', filter);
    });
    </script>
