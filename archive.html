    <script src="assets/app.js?v=20251030"></script>
    <script>
    window.addEventListener('DOMContentLoaded', async () => {
        const grid = document.getElementById('videoGrid');

        const fallback = {
            videos: [
                { title: '제9회 복면코치왕 결승전', youtubeId: 'qCP9jBqitZ4', description: '나비 vs. 미소로<br><br><em>"나비님 8강부터 응원했는데 덕분에 저도 결승까지 응원할 수 있게 되었네요! 인터뷰 영상에서 아이들에게 진실된 삶을 살아가는 사람으로 기억되고 싶다고 하신 점이 인상 깊었습니다! 나비님의 진정성에 오늘도 한 표 던집니다. 화이팅입니다!!"</em> - 처리중 -<br><em>"연륜과 여유가 느껴지는 미소로님 :) 코치님의 감동적인 영상을 보고 베팅을 확정하게 되었습니다. 제9회 복면코치왕!! 가보자고!! >.< 3만 포인트!! 가보자고!! >.< 미소로!! 가보자고!! :)"</em> - 왕관의주인공인가영 -', date: '2025-01-16', tags: ['결승전','풀영상','멘토코치','우승 소감','준우승 소감'] },
                { title: '제9회 복면코치왕 4강전', youtubeId: 'uQdj9lyW2vI', description: '1라운드: 나비 vs. 날아라<br>2라운드: 미소로 vs. 사람사랑<br><br><em>"나비처럼 자유롭게 마음껏 코칭 실력 뽐내시길요. 두 분 모두 훨훨 날아라! 화이팅!!"</em> - 깃털처럼 -<br><em>"8강에서 잘 해주셔서 또 응원할 수 있었네요!! 긴장하지 마시고 차분하게 고객의 레벨에 맞춰 고객의 잠재력을 발견할 수 있게 코칭해주세요~!! 응원합니다!!"</em> - 처리중 -', date: '2025-01-03', tags: ['4강전','배틀','베팅','참관'] },
                { title: '제9회 복면코치왕 8강전 결과 및 4강 진출자 인터뷰', youtubeId: '2BGZOvmDf_M', description: '1라운드: 나비 vs. 둥이둥이<br>2라운드: 사람사랑 vs. 제제<br>3라운드: 미소로 vs. 프코<br>4라운드: 날아라 vs. 바오밥<br><br><em>"배틀이라고 하지만 일반 경연과는 다르게 지고 이기는 것은 아닌 것 같습니다. 서로가 서로에게 배우고 참관자들도 배우는, 모두 다 성장하는 배틀이 될 거라고 생각합니다. 모두 응원합니다~"</em> - 따닥박사 -', date: '2024-12-20', tags: ['8강전','배틀','4강 진출자','베팅'] },
                { title: '제9회 복면코치왕 8강 진출자 인터뷰', youtubeId: 'VjEhIw45NAs', description: '8강 진출자에게 물어봤습니다!<br><em>"자신의 코칭 키워드 3가지는?"</em><br><em>"나에게 코칭이란?"</em>', date: '2024-12-17', tags: ['본선','베팅','8강 진출자'] },
                { title: '[CiT News] 제9회 복면코치왕 예선 결과', youtubeId: 'QqoGxK2EueY', description: '제9회 복면코치왕 본선 진출자 발표<br><em>나비, 날아라, 둥이둥이, 미소로, 바오밥, 사람사랑, 제제, 프코</em> (가나다순)', date: '2024-12-09', tags: ['예선','본선 진출자'] },
                { title: '[CiT News] 제9회 복면코치왕 예선 START!', youtubeId: 'UqgfncVIzFI', description: '자격증 떼고 오직 실력으로!<br>복면 뒤에서 펼쳐지는 코치들의 진검승부!', date: '2024-12-02', tags: ['CiT 방송국 개국','예선'] }
            ]
        };

        async function loadJson() {
            try {
                const res = await fetch('data/videos.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } catch (e) {
                return fallback;
            }
        }

        function render(data) {
            grid.innerHTML = '';
            data.videos.forEach(v => {
                const card = document.createElement('article');
                card.className = 'card video-card';
                const isHttpOrigin = location.origin && /^https?:/i.test(location.origin);
                const originParam = isHttpOrigin ? `&origin=${encodeURIComponent(location.origin)}` : '';

                // 썸네일 뷰 만들기 (클릭 시 iframe 교체)
                const thumbUrl = `https://i.ytimg.com/vi/${v.youtubeId}/hqdefault.jpg`;
                const thumb = document.createElement('div');
                thumb.className = 'thumb';
                thumb.style.position = 'relative';
                thumb.style.cursor = 'pointer';
                thumb.setAttribute('role', 'button');
                thumb.setAttribute('tabindex', '0');
                thumb.setAttribute('aria-label', `${v.title} 재생`);

                const img = document.createElement('img');
                img.src = thumbUrl;
                img.alt = v.title;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.display = 'block';

                const play = document.createElement('div');
                play.style.position = 'absolute';
                play.style.inset = '0';
                play.style.display = 'grid';
                play.style.placeItems = 'center';
                play.innerHTML = '<div style="width:68px;height:48px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);"><svg viewBox="0 0 68 48" width="68" height="48" aria-hidden="true"><path d="M45,24 27,14 27,34" fill="#fff"/></svg></div>';

                function activate() {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube-nocookie.com/embed/${v.youtubeId}?rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&autoplay=1${originParam}`;
                    iframe.title = v.title;
                    iframe.loading = 'lazy';
                    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframe.allowFullscreen = true;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = '0';
                    thumb.replaceWith(iframe);
                }

                thumb.addEventListener('click', activate);
                thumb.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activate();
                    }
                });

                thumb.appendChild(img);
                thumb.appendChild(play);

                const body = `
                    <div class="card-body">
                        <h3>${v.title}</h3>
                        <p>${v.description || ''}</p>
                    </div>`;

                const footer = `
                    <footer class="card-footer">
                        <time datetime="${v.date}">${v.date}</time>
                        ${v.tags && v.tags.length ? `<div class=\"tags\">${v.tags.map(t => `<span class=\"tag\">${t}</span>`).join('')}</div>` : ''}
                    </footer>`;

                card.appendChild(thumb);
                card.insertAdjacentHTML('beforeend', body + footer);
                grid.appendChild(card);
            });
        }

        const data = await loadJson();
        render(data);
    });
    </script>
